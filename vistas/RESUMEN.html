<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css" />
  <style>
    :root {
      --color-primary: #2f5496;
      --color-secondary: #8497b0;
      --color-background: #f2f2f2;
      --color-text: #2f5496;
      --color-budget: #4472c4;
      --color-real: #ffc000;
    }

    body {
      background-color: var(--color-background);
      font-family: 'Manrope', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--color-text);
      min-height: 100vh;
      padding-top: 70px;
    }

    .header-card {
      background: var(--color-primary);
      border-radius: 16px;
      border: 1px solid rgba(47, 84, 150, 0.1);
      color: #fff;
    }

    .table-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(47, 84, 150, 0.1);
      overflow: hidden;
    }

    .table-comparison {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.85rem;
      min-width: 960px;
    }

    .table-comparison thead th {
      border: 1px solid #d0d7de;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 0.75rem 0.6rem;
      vertical-align: middle;
      text-align: center;
      background-color: #fff;
    }

    .table-comparison tbody td,
    .table-comparison tbody th {
      border: 1px solid #e1e4e8;
      padding: 0.6rem 0.6rem;
      vertical-align: middle;
    }

    .table-comparison tbody th {
      font-weight: 600;
      text-align: left;
      background-color: #fff;
    }

    .table-comparison tbody tr:hover td {
      background-color: rgba(47, 84, 150, 0.04);
    }

    .section-row td {
      background-color: rgba(132, 151, 176, 0.2);
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
    }

    .section-label {
      padding-left: 1rem;
    }

    .module-row th {
      color: #c27a2b;
    }

    .sum-row td,
    .sum-row th {
      background-color: rgba(68, 114, 196, 0.1);
      font-weight: 700;
    }

    .table-comparison tbody tr.income td,
    .table-comparison tbody tr.income th {
      color: #2c8b57;
    }

    .table-comparison tbody tr.expense td,
    .table-comparison tbody tr.expense th {
      color: #c74b3a;
    }

    .text-green {
      color: #2c8b57;
      font-weight: 600;
    }

    .text-red {
      color: #c74b3a;
      font-weight: 600;
    }

    .btn-split {
      display: flex;
      gap: 1px;
      border-radius: 999px;
      overflow: hidden;
    }

    .btn-split .split-main,
    .btn-split .split-secondary {
      border-radius: 0;
      flex: 1;
    }

    .btn-split .split-main {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
    }

    body.ocultar-cuentas th:first-child,
    body.ocultar-cuentas td:first-child {
      display: none;
    }

    @media (max-width: 1200px) {
      .table-responsive {
        overflow-x: auto;
      }
    }

    @media (max-width: 768px) {
      .table-comparison {
        font-size: 0.72rem;
      }

      .table-comparison thead th,
      .table-comparison tbody td {
        padding: 0.45rem 0.35rem;
      }
    }
  </style>
</head>
<body data-modulo="Resumen" data-modulo-alias="Resumen" data-modulo-id="resumen">
  <div class="container py-4 py-lg-5">
    <div class="row mb-4">
      <div class="col-12">
        <div class="card header-card fade-in">
          <div class="card-body">
            <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3">
              <div>
                <h1 class="fw-bold display-6 mb-2">Resumen</h1>
              </div>
              <div class="text-end d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2 justify-content-end">
                <span class="badge bg-white text-primary">Ppto vs Real</span>
                <button type="button" class="btn btn-chip btn-chip-outline d-none" id="toggleAccountColumnBtn" aria-pressed="true">
                  <i class="bi bi-eye-slash"></i>
                  <span class="toggle-account-label">Ocultar cuentas</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <label for="selReal" class="form-label fw-semibold text-muted small mb-2">Ejercicio</label>
        <select id="selReal" class="form-select" data-role="module-year-select" aria-label="Selecciona el ejercicio">
          <option value="">Cargando ejercicios...</option>
        </select>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-12">
        <div class="card table-card fade-in">
          <div class="card-body p-3">
            <div class="workflow-toolbar">
              <div>
                <p class="text-muted fw-semibold mb-1">Estado del flujo</p>
                <div class="workflow-badge" id="workflowBadge">Sin cambios</div>
                <p class="workflow-meta mb-0" id="workflowMeta">Lista para guardar.</p>
              </div>
            <div class="toolbar-actions" role="group">
              <div class="btn-split" id="editSplitBtn">
                <button type="button" class="btn btn-chip btn-chip-primary split-main" id="saveLayoutBtn">
                  <i class="bi bi-save"></i>
                  Guardar edición
                </button>
                <button type="button" class="btn btn-chip btn-chip-outline split-secondary" id="cancelLayoutBtn">
                  <i class="bi bi-x-circle"></i>
                  Cancelar edición
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="card table-card fade-in">
          <div class="table-responsive">
            <table class="table table-comparison mb-0" aria-label="Tabla de resumen ejecutivo">
              <thead>
                <tr>
                  <th scope="col">Cuenta</th>
                  <th scope="col">Real <span id="hdrRealYear">YYYY</span></th>
                  <th scope="col">Ppto. <span id="hdrPptoYear">YYYY</span></th>
                  <th scope="col">Real <span id="hdrPrevYear">YYYY-1</span></th>
                  <th scope="col">Variacion Ppto vs Real</th>
                  <th scope="col">Variacion Real vs Real anterior</th>
                  <th scope="col">Seccion</th>
                  <th scope="col">Real <span id="hdrRealYear2">YYYY</span></th>
                  <th scope="col">Ppto. <span id="hdrPptoYear2">YYYY</span></th>
                  <th scope="col">Real <span id="hdrPrevYear2">YYYY-1</span></th>
                  <th scope="col">Variacion Ppto vs Real</th>
                  <th scope="col">Variacion Real vs Real anterior</th>
                </tr>
              </thead>
              <tbody id="tablaResumenBody">
                <tr>
                  <td colspan="12" class="text-center text-muted py-5">Cargando datos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/sesion.js"></script>
  <script src="js/capitulos-modulos.js"></script>
  <script src="js/cuentas-modulo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    const API_BASE = 'http://localhost:3000/api';
    const MODULES = [
      { key: 'vpe', label: 'VPE', type: 'income', keywords: ['vpe'], prefixes: ['3'] },
      { key: 'comunicacion', label: 'Comunicacion', type: 'income', keywords: ['comunicaci', 'communication'], prefixes: ['4'] },
      { key: 'gtos-corporativos', label: 'Gtos Corporativos', type: 'expense', keywords: ['corporativos', 'corporate'], prefixes: ['9'] },
      { key: 'tic', label: 'T&IC', type: 'income', keywords: ['t&ic', 'trade'], prefixes: ['7'] },
      { key: 'comites', label: 'Comites', type: 'income', keywords: ['comite'], prefixes: ['4'] },
      { key: 'finanzas', label: 'Finanzas', type: 'income', keywords: ['finance', 'finanza'], prefixes: ['4'] },
      { key: 'serv-membresia', label: 'Servicios a la membresia', type: 'expense', keywords: ['servicios', 'services'], prefixes: ['5', '6'] },
      { key: 'membresia', label: 'Membresia', type: 'income', keywords: ['membership'], prefixes: ['4'] },
      { key: 'rh', label: 'Recursos Humanos', type: 'expense', keywords: ['human', 'recursos'], prefixes: ['8'] },
      { key: 'eventos', label: 'Eventos', type: 'income', keywords: ['event'], prefixes: ['4'] }
    ];
    const state = {
      empresaId: 'empresa2',
      realYear: null,
      prevYear: null,
      pptoYear: null,
      codigos: [],
      rows: []
    };
    const fmtNum = (n) => new Intl.NumberFormat('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Number(n) || 0);
    const fmtPct = (v) => `${(Number(v) * 100).toFixed(0)}%`;
    const ACCOUNT_COLUMN_STORAGE_KEY = 'resumen_ocultar_cuentas';
    const workflowBadgeEl = document.getElementById('workflowBadge');
    const workflowMetaEl = document.getElementById('workflowMeta');

    const applyAccountVisibility = (ocultar) => {
      document.body.classList.toggle('ocultar-cuentas', Boolean(ocultar));
      const button = document.getElementById('toggleAccountColumnBtn');
      if (!button) return;
      const label = button.querySelector('.toggle-account-label');
      if (label) {
        label.textContent = ocultar ? 'Mostrar cuentas' : 'Ocultar cuentas';
      }
      button.setAttribute('aria-pressed', ocultar ? 'true' : 'false');
    };

    const initAccountToggle = () => {
      const button = document.getElementById('toggleAccountColumnBtn');
      if (!button) return;
      const sesionActual = window.sesion || (typeof Sesion !== 'undefined' ? Sesion.obtener() : null);
      const esAdminGlobal = typeof Sesion !== 'undefined'
        && typeof Sesion.esAdminGlobal === 'function'
        && Sesion.esAdminGlobal(sesionActual);
      if (!esAdminGlobal) {
        applyAccountVisibility(true);
        button.classList.add('d-none');
        button.setAttribute('aria-disabled', 'true');
        button.setAttribute('disabled', 'true');
        button.setAttribute('tabindex', '-1');
        localStorage.setItem(ACCOUNT_COLUMN_STORAGE_KEY, '1');
        return;
      }
      button.classList.remove('d-none');
      const preferencia = localStorage.getItem(ACCOUNT_COLUMN_STORAGE_KEY) === '1';
      applyAccountVisibility(preferencia);
      button.addEventListener('click', () => {
        const ocultar = !document.body.classList.contains('ocultar-cuentas');
        applyAccountVisibility(ocultar);
        localStorage.setItem(ACCOUNT_COLUMN_STORAGE_KEY, ocultar ? '1' : '0');
      });
    };
    const setStatus = (text, isError = false) => {
      const el = document.getElementById('statusText');
      if (el) {
        el.textContent = `Estado: ${text}`;
        el.style.color = isError ? '#c74b3a' : '#4b6a9b';
      }
      if (workflowMetaEl) {
        workflowMetaEl.textContent = text;
      }
      if (workflowBadgeEl) {
        workflowBadgeEl.textContent = isError ? 'Error' : 'Activo';
      }
    };
    const headersAuth = () => {
      const h = window.Sesion?.headersAutenticacion?.() || {};
      return { ...h, 'Content-Type': 'application/json' };
    };
    const normalizeYears = (list) => {
      if (!Array.isArray(list)) return [];
      return Array.from(new Set(list.filter((year) => year && !Number.isNaN(Number(year))).map(Number)))
        .sort((a, b) => b - a);
    };

    const fillYearSelect = (years) => {
      const sel = document.getElementById('selReal');
      if (!sel) return;
      const normalized = normalizeYears(years);
      sel.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-';
      sel.appendChild(placeholder);
      normalized.forEach((year) => {
        const opt = document.createElement('option');
        opt.value = String(year);
        opt.textContent = String(year);
        sel.appendChild(opt);
      });
      const selectedYear = normalized.length ? normalized[0] : new Date().getFullYear();
      state.realYear = selectedYear;
      state.pptoYear = selectedYear;
      state.prevYear = normalized[1] || selectedYear - 1;
      sel.value = String(state.realYear);
      ['RealYear', 'RealYear2'].forEach((id) => {
        const el = document.getElementById(`hdr${id}`);
        if (el) el.textContent = state.realYear;
      });
      ['PptoYear', 'PptoYear2'].forEach((id) => {
        const el = document.getElementById(`hdr${id}`);
        if (el) el.textContent = state.pptoYear;
      });
      ['PrevYear', 'PrevYear2'].forEach((id) => {
        const el = document.getElementById(`hdr${id}`);
        if (el) el.textContent = state.prevYear;
      });
    };
    const fetchYears = async () => {
      const url = `${API_BASE}/modulos/summary-anios`;
      const params = new URLSearchParams({ empresaId: state.empresaId });
      const res = await fetch(`${url}?${params.toString()}`, { headers: headersAuth() });
      if (!res.ok) throw new Error('No fue posible listar anios');
      const data = await res.json();
      const years = Array.isArray(data.anios) ? data.anios.filter(Boolean).map(Number).sort((a, b) => b - a) : [];
      return years.length ? years : [new Date().getFullYear(), new Date().getFullYear() - 1];
    };
    const fetchCodigos = async () => {
      if (!state.realYear) throw new Error('Anio real no seleccionado');
      const query = new URLSearchParams({ empresaId: state.empresaId, anio: state.realYear });
      const res = await fetch(`${API_BASE}/saldos/cuentas?${query.toString()}`, { headers: headersAuth() });
      if (!res.ok) throw new Error('No fue posible obtener cuentas');
      const body = await res.json();
      return Array.isArray(body.cuentas) ? body.cuentas.map((c) => c.cuenta).filter(Boolean) : [];
    };
    const fetchResumen = async () => {
      const payload = {
        empresaId: state.empresaId,
        anio: state.realYear,
        periodo: 12,
        codigos: state.codigos,
        anioComparativo: state.prevYear,
        usarAjusteEnYTD: false
      };
      const res = await fetch(`${API_BASE}/modulos/summary-resumen-e`, {
        method: 'POST',
        headers: headersAuth(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('No fue posible obtener resumen-e');
      const data = await res.json();
      return Array.isArray(data.detalle) ? data.detalle : [];
    };
    const matchModule = (row) => {
      const text = (row.descripcion || '').toLowerCase();
      const code = (row.codigo || '').replace(/[^0-9]/g, '');
      return MODULES.find((m) => {
        if (m.keywords.some((k) => text.includes(k))) return true;
        return m.prefixes.some((pref) => code.startsWith(pref));
      });
    };
    const guardarEdicion = () => {
      const guardar = window.CuentasModulo?.guardarLayout?.();
      if (guardar === false) {
        setStatus('No fue posible guardar la edición.', true);
        return;
      }
      setStatus('Edición guardada.');
    };

    const cancelarEdicion = () => {
      const confirmacion = window.confirm('¿Deseas cancelar la edición? Se descartarán los cambios no guardados.');
      if (!confirmacion) return;
      if (window.CuentasModulo?.cancelEdit) {
        window.CuentasModulo.cancelEdit();
      }
      setStatus('Edición cancelada.');
    };

    const buildRows = (detalle) => {
      const modules = MODULES.reduce((acc, module) => {
        acc[module.key] = {
          ...module,
          totals: { real: 0, ppto: 0, prev: 0 },
          rows: []
        };
        return acc;
      }, {});
      const others = { label: 'Otros', type: 'other', totals: { real: 0, ppto: 0, prev: 0 }, rows: [] };
      detalle.forEach((entry) => {
        const targetModule = matchModule(entry);
        const bucket = targetModule ? modules[targetModule.key] : others;
        const real = Number(entry.ytdActual ?? entry.acumuladoActual ?? 0);
        const ppto = Number(entry.ytdPlan ?? entry.acumuladoPlan ?? 0);
        const prev = Number(entry.ytdAnterior ?? entry.acumuladoAnterior ?? 0);
        bucket.totals.real += real;
        bucket.totals.ppto += ppto;
        bucket.totals.prev += prev;
        bucket.rows.push({
          code: entry.codigo || '',
          label: entry.descripcion || '',
          module: bucket.label,
          type: bucket.type,
          real,
          ppto,
          prev,
          varPpto: ppto ? real / ppto - 1 : 0,
          varReal: prev ? real / prev - 1 : 0
        });
      });
      const sectionRows = [];
      const pushSection = (label, entries, isIncome) => {
        if (!entries.length) return;
        sectionRows.push({ section: true, label, type: isIncome ? 'income' : 'expense', data: null });
        const sectionTotals = entries.reduce((acc, entry) => {
          const totals = entry.totals || { real: 0, ppto: 0, prev: 0 };
          acc.real += totals.real;
          acc.ppto += totals.ppto;
          acc.prev += totals.prev;
          return acc;
        }, { real: 0, ppto: 0, prev: 0 });

        entries.forEach((entry) => {
          const totals = entry.totals;
          const varPpto = totals.ppto ? totals.real / totals.ppto - 1 : 0;
          const varReal = totals.prev ? totals.real / totals.prev - 1 : 0;
          sectionRows.push({
            type: entry.type,
            isModule: true,
            label: entry.label,
            module: entry.label,
            real: totals.real,
            ppto: totals.ppto,
            prev: totals.prev,
            varPpto,
            varReal
          });
          entry.rows.forEach((row) => sectionRows.push(row));
        });

        const sectionVarPpto = sectionTotals.ppto ? sectionTotals.real / sectionTotals.ppto - 1 : 0;
        const sectionVarReal = sectionTotals.prev ? sectionTotals.real / sectionTotals.prev - 1 : 0;
        sectionRows.push({
          type: isIncome ? 'income' : 'expense',
          isSectionTotal: true,
          label: `${label} total`,
          real: sectionTotals.real,
          ppto: sectionTotals.ppto,
          prev: sectionTotals.prev,
          varPpto: sectionVarPpto,
          varReal: sectionVarReal
        });
      };
      const incomeModules = MODULES.filter((m) => m.type === 'income').map((m) => modules[m.key]);
      const expenseModules = MODULES.filter((m) => m.type === 'expense').map((m) => modules[m.key]);
      pushSection('Income', incomeModules, true);
      pushSection('Expense', expenseModules, false);
      if (others.rows.length) {
        pushSection('Otros', [others], false);
      }
      return sectionRows;
    };
    const renderTable = () => {
      const tbody = document.getElementById('tablaResumenBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!state.rows.length) {
        tbody.innerHTML = `<tr><td colspan="12" class="text-center text-muted py-4">Sin datos</td></tr>`;
        return;
      }
      state.rows.forEach((row) => {
        if (row.section) {
          const sectionRow = document.createElement('tr');
          sectionRow.className = 'section-row';
          const sectionCell = document.createElement('td');
          sectionCell.setAttribute('colspan', '12');
          sectionCell.className = 'section-label';
          sectionCell.textContent = row.label;
          sectionRow.appendChild(sectionCell);
          tbody.appendChild(sectionRow);
          return;
        }
        if (row.isSectionTotal) {
          const real = fmtNum(row.real);
          const ppto = fmtNum(row.ppto);
          const prev = fmtNum(row.prev);
          const varPpto = fmtPct(row.varPpto);
          const varReal = fmtPct(row.varReal);
          const positivePpto = row.varPpto >= 0 ? 'text-green' : 'text-red';
          const positiveReal = row.varReal >= 0 ? 'text-green' : 'text-red';
          const tr = document.createElement('tr');
          const classes = ['sum-row'];
          if (row.type) classes.push(row.type);
          tr.className = classes.join(' ');
          tr.innerHTML = `
            <th scope="row"></th>
            <td>${real}</td>
            <td>${ppto}</td>
            <td>${prev}</td>
            <td class="${positivePpto}">${varPpto}</td>
            <td class="${positiveReal}">${varReal}</td>
            <td>${row.label}</td>
            <td>${real}</td>
            <td>${ppto}</td>
            <td>${prev}</td>
            <td class="${positivePpto}">${varPpto}</td>
            <td class="${positiveReal}">${varReal}</td>
          `;
          tbody.appendChild(tr);
          return;
        }
        const codeCell = row.isModule ? '' : row.code;
        const labelCell = row.isModule ? row.label : row.label || row.module;
        const real = fmtNum(row.real);
        const ppto = fmtNum(row.ppto);
        const prev = fmtNum(row.prev);
        const varPpto = fmtPct(row.varPpto);
        const varReal = fmtPct(row.varReal);
        const positivePpto = row.varPpto >= 0 ? 'text-green' : 'text-red';
        const positiveReal = row.varReal >= 0 ? 'text-green' : 'text-red';
        const tr = document.createElement('tr');
        const rowClasses = [];
        if (row.isModule) rowClasses.push('module-row');
        if (row.type) rowClasses.push(row.type);
        if (rowClasses.length) tr.className = rowClasses.join(' ');
        tr.innerHTML = `
          <th scope="row">${codeCell || ''}</th>
          <td>${real}</td>
          <td>${ppto}</td>
          <td>${prev}</td>
          <td class="${positivePpto}">${varPpto}</td>
          <td class="${positiveReal}">${varReal}</td>
          <td>${labelCell}</td>
          <td>${real}</td>
          <td>${ppto}</td>
          <td>${prev}</td>
          <td class="${positivePpto}">${varPpto}</td>
          <td class="${positiveReal}">${varReal}</td>
        `;
        tbody.appendChild(tr);
      });
    };
    const cargarResumen = async () => {
      try {
        setStatus('Cargando datos...');
        const years = await fetchYears();
        fillYearSelect(years);
        state.codigos = await fetchCodigos();
        if (!state.codigos.length) throw new Error('No se pudieron obtener cuentas (API no disponible)');
        const detalle = await fetchResumen();
        state.rows = buildRows(detalle);
        renderTable();
        setStatus(`Empresa ${state.empresaId}, anio ${state.realYear}`);
      } catch (error) {
        console.error(error);
        setStatus(error.message, true);
        const tbody = document.getElementById('tablaResumenBody');
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="12" class="text-center text-danger py-4">${error.message}</td></tr>`;
        }
        state.rows = [];
      }
    };
    document.addEventListener('DOMContentLoaded', () => {
      const selEmpresa = document.getElementById('selEmpresa');
      const selReal = document.getElementById('selReal');
      if (selEmpresa) {
        selEmpresa.addEventListener('change', (e) => {
          state.empresaId = e.target.value;
          cargarResumen();
        });
      }
      if (selReal) {
        selReal.addEventListener('change', (e) => {
          state.realYear = Number(e.target.value);
          state.prevYear = state.realYear - 1;
          document.getElementById('hdrRealYear').textContent = state.realYear;
          document.getElementById('hdrPptoYear').textContent = state.realYear;
          document.getElementById('hdrPrevYear').textContent = state.prevYear;
          document.getElementById('hdrRealYear2').textContent = state.realYear;
          document.getElementById('hdrPptoYear2').textContent = state.realYear;
          document.getElementById('hdrPrevYear2').textContent = state.prevYear;
          cargarResumen();
        });
      }
      const saveLayoutBtn = document.getElementById('saveLayoutBtn');
      const cancelLayoutBtn = document.getElementById('cancelLayoutBtn');
      if (saveLayoutBtn) {
        saveLayoutBtn.addEventListener('click', guardarEdicion);
      }
      if (cancelLayoutBtn) {
        cancelLayoutBtn.addEventListener('click', cancelarEdicion);
      }
      initAccountToggle();
      cargarResumen();
    });
  </script>
</body>
</html>
