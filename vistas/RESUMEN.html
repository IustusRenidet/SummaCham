<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resumen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    :root {
      --color-primary: #2f5496;
      --color-secondary: #8497b0;
      --color-background: #f2f2f2;
      --color-text: #2f5496;
      --bs-primary: #2f5496;
      --bs-primary-rgb: 47, 84, 150;
      --bs-success: #2f5496;
      --bs-success-rgb: 47, 84, 150;
      --bs-success-bg-subtle: rgba(47, 84, 150, 0.16);
      --bs-success-border-subtle: rgba(47, 84, 150, 0.35);
    }
    body {
      background-color: var(--color-background);
      font-family: 'Manrope', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--color-text);
      min-height: 100vh;
      padding-top: 70px;
    }
    .header-card {
      background: var(--color-primary);
      border: 1px solid rgba(47, 84, 150, 0.1);
      border-radius: 16px;
      color: #fff;
    }
    .table-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(47, 84, 150, 0.1);
      overflow: hidden;
    }
    .table thead {
      background-color: #d9d9d9;
    }
    .table thead th {
      border: none;
      font-weight: 600;
      color: #2f5496;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }
    .table tbody tr { transition: background-color 0.3s ease; }
    .table tbody tr:hover { background-color: rgba(47, 84, 150, 0.05); }
    .section-header-row {
      background-color: rgba(132, 151, 176, 0.25);
      font-weight: 800 !important;
      border-left: 4px solid var(--color-secondary);
    }
    .section-header-row td {
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      padding-top: 1rem;
      padding-bottom: 1rem;
      font-family: 'Manrope', sans-serif;
    }
    .section-header-row td:first-child {
      font-size: 1rem;
      font-weight: 900;
    }
    .positive { color: #2f5496; font-weight: 600; }
    .negative { color: #8497b0; font-weight: 600; }
    .neutral  { color: rgba(47, 84, 150, 0.6); font-weight: 600; }


    .fade-in { animation: fadeIn .5s ease-in; }
    @keyframes fadeIn { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }

    .city-pill {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      padding: .4rem .75rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .selector-wrapper {
      gap: .75rem;
    }
    .pct-item.highlight strong, .pct-item.highlight span { color: var(--color-primary); }
  </style>
</head>
<body>

  <div class="container py-4 py-lg-5">
    <!-- Encabezado -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card header-card fade-in">
          <div class="card-body d-flex flex-column flex-lg-row align-items-center justify-content-between">
            <div class="text-center text-lg-start">
              <h1 id="chapterTitle" class="fw-bold display-6 mb-2">Resumen</h1>
              <p id="chapterSubtitle" class="mb-0 fs-5">Capítulo Guadalajara</p>
            </div>
            <div class="mt-3 mt-lg-0 d-flex align-items-center selector-wrapper">
              <label for="citySelect" class="me-2 fw-semibold">Ciudad:</label>
              <select id="citySelect" class="form-select form-select-sm w-auto">
                <option value="GDL" selected>Guadalajara</option>
                <option value="CDMX">Ciudad de México</option>
                <option value="MTY">Noreste</option>
                <option value="NO">Noroeste</option>
              </select>
              <span class="city-pill ms-2" id="cityPill">Guadalajara</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Porcentaje Gastos Corporativos -->
<div class="row mb-4">
  <div class="col-12">
    <div class="card table-card fade-in">
      <div class="card-body">
          <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between">
            <h5 class="fw-bold mb-3 mb-md-0" style="color: var(--color-primary);">Porcentaje Gastos Corporativos</h5>
            <div class="d-flex align-items-center gap-3 flex-wrap" id="yearFilters" aria-live="polite">
              <span class="fw-semibold mb-0">Años:</span>
            </div>
          </div>

        <div id="pctContainer" class="row mt-3">
          <!-- Tarjetas por año se inyectan aquí -->
        </div>

        <small class="text-muted d-block mt-2">Tip: el porcentaje de la ciudad seleccionada se resalta. Puedes comparar uno o varios años.</small>
      </div>
    </div>
  </div>
</div>


    <!-- Tabla principal -->
    <div class="row">
      <div class="col-12">
        <div class="table-card fade-in">
          <div id="resumenStatus" class="alert alert-info mb-3 visually-hidden" role="status"></div>
          <div class="table-responsive">
            <table class="table align-middle mb-0" id="mainTable">
              <thead>
                <tr>
                  <th scope="col" class="text-start"></th>
                  <th scope="col" class="text-end">Real <span class="anio">2025</span></th>
                  <th scope="col" class="text-end">Ppto. <span class="anio">2025</span></th>
                  <th scope="col" class="text-end">Real <span class="anio">2024</span></th>
                  <th scope="col" class="text-end">Variación Real <span class="anio">2024</span> vs Real <span class="anio">2025</span></th>
                  <th scope="col" class="text-end">Variación Ppto. <span class="anio">2025</span> vs Real <span class="anio">2025</span></th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- Filas inyectadas por JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sesion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const sesion = Sesion.requerirSesion();
    if (!sesion) {
      throw new Error('Redireccionando al inicio de sesión.');
    }

    Sesion.asegurarEnlaceAdministrarUsuarios(document.querySelector('#navbarNav .navbar-nav'));



    const API_BASE = 'http://localhost:3000/api';
    const estado = document.getElementById('resumenStatus');
    const citySelect = document.getElementById('citySelect');
    const cityPill = document.getElementById('cityPill');
    const chapterTitle = document.getElementById('chapterTitle');
    const chapterSubtitle = document.getElementById('chapterSubtitle');
    const tableBody = document.getElementById('tableBody');
    const pctContainer = document.getElementById('pctContainer');
    const yearFilters = document.getElementById('yearFilters');

    const estadoModulo = {
      datos: {
        ciudades: [],
        anios: [],
        tabla: [],
        gastosCorporativos: {}
      },
      ciudadActual: '',
      aniosActivos: new Set()
    };

    const limpiarEstado = () => {
      if (!estado) return;
      estado.className = 'alert alert-info mb-3 visually-hidden';
      estado.textContent = '';
    };

    const mostrarEstado = (mensaje, tipo = 'info') => {
      if (!estado) return;
      estado.textContent = mensaje;
      estado.className = `alert alert-${tipo} mb-3`;
    };

    const construirOpcionCiudad = (ciudad) => {
      const opcion = document.createElement('option');
      opcion.value = ciudad.id;
      opcion.textContent = ciudad.etiqueta || ciudad.nombre || ciudad.id;
      return opcion;
    };

    const actualizarEncabezado = () => {
      const ciudadSeleccionada = estadoModulo.datos.ciudades.find((ciudad) => ciudad.id === estadoModulo.ciudadActual);
      const etiqueta = ciudadSeleccionada?.etiqueta || ciudadSeleccionada?.nombre || '';
      const etiquetaVisible = etiqueta || 'Sin datos';
      chapterTitle.textContent = 'Resumen';
      chapterSubtitle.textContent = etiqueta ? `Capítulo ${etiqueta}` : 'Sin información disponible';
      cityPill.textContent = etiquetaVisible;
      document.title = etiqueta ? `Resumen - ${etiqueta}` : 'Resumen';
    };

    const renderizarTabla = () => {
      tableBody.innerHTML = '';
      const filas = estadoModulo.datos.tabla.filter((fila) => {
        if (fila.ciudad && estadoModulo.ciudadActual) {
          return fila.ciudad === estadoModulo.ciudadActual;
        }
        return true;
      });

      if (filas.length === 0) {
        const vacio = document.createElement('tr');
        vacio.innerHTML = '<td colspan="6" class="text-center text-muted py-4">No hay información para mostrar.</td>';
        tableBody.appendChild(vacio);
        return;
      }

      filas.forEach((fila) => {
        if (fila.type === 'section') {
          const tr = document.createElement('tr');
          tr.className = 'section-header-row';
          tr.innerHTML = `
            <td>${fila.name || ''}</td>
            <td class="text-end">${fila.real2025 || '—'}</td>
            <td class="text-end">${fila.ppto2025 || '—'}</td>
            <td class="text-end">${fila.real2024 || '—'}</td>
            <td class="text-end">${fila.varReal || '—'}</td>
            <td class="text-end">${fila.varPpto || '—'}</td>
          `;
          tableBody.appendChild(tr);
        } else {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${fila.name || ''}</td>
            <td class="text-end">${fila.real2025 || '—'}</td>
            <td class="text-end">${fila.ppto2025 || '—'}</td>
            <td class="text-end">${fila.real2024 || '—'}</td>
            <td class="text-end">${fila.varReal || '—'}</td>
            <td class="text-end">${fila.varPpto || '—'}</td>
          `;
          tableBody.appendChild(tr);
        }
      });
    };

    const destacarCiudad = () => {
      document.querySelectorAll('.pct-item').forEach((elemento) => elemento.classList.remove('highlight'));
      if (!estadoModulo.ciudadActual) return;
      document.querySelectorAll(`.pct-item[data-city="${estadoModulo.ciudadActual}"]`).forEach((elemento) => elemento.classList.add('highlight'));
    };

    const renderizarGastosCorporativos = () => {
      pctContainer.innerHTML = '';
      const gastos = estadoModulo.datos.gastosCorporativos || {};
      const anios = estadoModulo.datos.anios || [];
      const activos = Array.from(estadoModulo.aniosActivos);

      if (!anios.length) {
        pctContainer.innerHTML = '<div class="col-12"><div class="alert alert-secondary mb-0">Aún no se han configurado años para esta sección.</div></div>';
        return;
      }

      if (activos.length === 0) {
        pctContainer.innerHTML = '<div class="col-12"><div class="alert alert-warning mb-0">Selecciona al menos un año para visualizar los porcentajes.</div></div>';
        return;
      }

      activos.forEach((anio) => {
        const valoresPorCiudad = gastos[anio] || {};
        const tarjeta = document.createElement('div');
        tarjeta.className = 'col-12 col-lg-4';
        tarjeta.innerHTML = `
          <div class="p-4 border rounded-4 h-100 shadow-sm bg-white">
            <h6 class="fw-bold text-success mb-3">${anio}</h6>
            <div class="d-flex flex-column gap-2">
              ${estadoModulo.datos.ciudades.map((ciudad) => {
                const valor = valoresPorCiudad[ciudad.id];
                const contenido = valor != null ? `${valor}%` : '—';
                return `
                  <div class="d-flex justify-content-between mb-1 pct-item" data-city="${ciudad.id}" data-year="${anio}">
                    <span class="fw-semibold">${ciudad.etiqueta || ciudad.nombre || ciudad.id}</span>
                    <strong>${contenido}</strong>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        pctContainer.appendChild(tarjeta);
      });

      destacarCiudad();
    };

    const prepararFiltrosAnio = () => {
      const anios = estadoModulo.datos.anios || [];
      yearFilters.querySelectorAll('.form-check').forEach((nodo) => nodo.remove());

      if (!anios.length) {
        const mensaje = document.createElement('span');
        mensaje.className = 'text-muted small';
        mensaje.textContent = 'Sin años disponibles';
        yearFilters.appendChild(mensaje);
        return;
      }

      anios.forEach((anio) => {
        const contenedor = document.createElement('div');
        contenedor.className = 'form-check form-check-inline';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'form-check-input year-check';
        input.id = `year-${anio}`;
        input.value = anio;
        input.checked = estadoModulo.aniosActivos.size === 0 || estadoModulo.aniosActivos.has(anio);
        if (input.checked) {
          estadoModulo.aniosActivos.add(anio);
        }
        const etiqueta = document.createElement('label');
        etiqueta.className = 'form-check-label';
        etiqueta.setAttribute('for', input.id);
        etiqueta.textContent = anio;
        input.addEventListener('change', (evento) => {
          if (evento.target.checked) {
            estadoModulo.aniosActivos.add(anio);
          } else {
            estadoModulo.aniosActivos.delete(anio);
          }
          renderizarGastosCorporativos();
        });
        contenedor.appendChild(input);
        contenedor.appendChild(etiqueta);
        yearFilters.appendChild(contenedor);
      });
    };

    const prepararCiudades = () => {
      citySelect.innerHTML = '';
      const ciudades = estadoModulo.datos.ciudades || [];
      if (!ciudades.length) {
        const opcion = document.createElement('option');
        opcion.value = '';
        opcion.textContent = 'Sin ciudades disponibles';
        citySelect.appendChild(opcion);
        citySelect.disabled = true;
        estadoModulo.ciudadActual = '';
        actualizarEncabezado();
        renderizarTabla();
        renderizarGastosCorporativos();
        return;
      }

      citySelect.disabled = false;
      ciudades.forEach((ciudad) => citySelect.appendChild(construirOpcionCiudad(ciudad)));
      estadoModulo.ciudadActual = ciudades[0]?.id || '';
      citySelect.value = estadoModulo.ciudadActual;
      actualizarEncabezado();
      renderizarTabla();
      renderizarGastosCorporativos();
    };

    const cargarDatos = async () => {
      mostrarEstado('Cargando información…');
      try {
        const respuesta = await fetch(`${API_BASE}/modulos/resumen`, {
          headers: Sesion.headersAutenticacion()
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) {
          throw new Error(datos.mensaje || 'No fue posible obtener la información.');
        }
        estadoModulo.datos = {
          ciudades: Array.isArray(datos.ciudades) ? datos.ciudades : [],
          anios: Array.isArray(datos.anios) ? datos.anios : [],
          tabla: Array.isArray(datos.tabla) ? datos.tabla : [],
          gastosCorporativos: datos.gastosCorporativos || {}
        };
        estadoModulo.aniosActivos = new Set(estadoModulo.datos.anios);
        prepararFiltrosAnio();
        prepararCiudades();
        limpiarEstado();
      } catch (error) {
        mostrarEstado(error.message || 'Ocurrió un error al cargar la información.', 'danger');
        console.error('Error al cargar resumen', error);
        estadoModulo.datos = { ciudades: [], anios: [], tabla: [], gastosCorporativos: {} };
        estadoModulo.aniosActivos = new Set();
        prepararFiltrosAnio();
        prepararCiudades();
      }
    };

    citySelect.addEventListener('change', (evento) => {
      estadoModulo.ciudadActual = evento.target.value;
      actualizarEncabezado();
      renderizarTabla();
      destacarCiudad();
    });

    Sesion.asegurarEnlaceAdministrarUsuarios(document.querySelector('#navbarNav .navbar-nav'));
    cargarDatos();
  </script>
  
</body>
</html>
