<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen Presupuestario</title>
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #fff;
      --border: #d1d7e2;
      --text: #2b3852;
      --muted: #6f7a8c;
      --accent: #c27a2b;
      --accent-dark: #1f2b3f;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 30px rgba(18, 32, 73, 0.08);
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.4px;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }
    .status {
      font-size: 14px;
      color: var(--muted);
    }
    .table-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(33, 49, 81, 0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    thead th {
      background: var(--accent-dark);
      color: #fff;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 12px;
      border: 1px solid var(--border);
    }
    tbody td {
      padding: 12px;
      border: 1px solid var(--border);
    }
    tbody tr:nth-child(even) {
      background: #f9fbff;
    }
    .section {
      font-weight: 700;
      color: var(--accent-dark);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .indent-2 { padding-left: 24px; }
    .indent-3 { padding-left: 36px; }
    .accent { color: var(--accent); }
    .delta { text-align: right; }
    .text-green { color: #2e8b57; }
    .text-red { color: #c74b3a; }
    .notes { font-size: 13px; color: var(--muted); margin-top: 12px; }
    @media (max-width: 960px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Resumen Ejecutivo</h1>
        <p class="notes">Los totales se calculan desde resumen-e y agrupan por cuentas clave.</p>
      </div>
      <div class="controls">
        <label>
          Empresa
          <select id="selEmpresa">
            <option value="empresa1">Ciudad de México</option>
            <option value="empresa2" selected>Guadalajara</option>
            <option value="empresa3">Noreste</option>
            <option value="empresa4">Noroeste</option>
          </select>
        </label>
        <label>
          Año Real
          <select id="selReal"></select>
        </label>
        <span id="statusText" class="status">Estado: cargando datos...</span>
      </div>
    </header>

    <section class="table-shell">
      <table>
        <thead>
          <tr>
            <th style="width:30%;">Concepto</th>
            <th>Real <span id="hdrRealYear">YYYY</span></th>
            <th>PPTO <span id="hdrPptoYear">YYYY</span></th>
            <th>Real <span id="hdrPrevYear">YYYY-1</span></th>
            <th>Var Real vs anterior</th>
            <th>Var Ppto vs real</th>
          </tr>
        </thead>
        <tbody id="tablaResumen">
          <tr>
            <td colspan="6" style="text-align:center; padding:20px;">Esperando datos...</td>
          </tr>
        </tbody>
      </table>
      <p class="notes">Si la API /saldos/cuentas no responde se muestra esta advertencia en la tabla.</p>
    </section>
  </main>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    const state = {
      empresaId: 'empresa2',
      realYear: null,
      prevYear: null,
      pptoYear: null,
      codigos: [],
      rows: []
    };

    const structure = [
      { id: 'INCOME', label: 'Income', level: 1, section: true },
      { id: 'MEMBERSHIP', label: 'Membership', level: 2, parent: 'INCOME', prefixes: ['400'] },
      { id: 'CUOTAS', label: 'Cuotas Netas', level: 3, parent: 'MEMBERSHIP', prefixes: ['400'] },
      { id: 'SOCIOS', label: 'Ingresos socios nuevos', level: 3, parent: 'MEMBERSHIP', prefixes: ['401'] },
      { id: 'EVENTOS', label: 'Events', level: 2, parent: 'INCOME', prefixes: ['404', '405'] },
      { id: 'PATROCINIOS', label: 'Patrocinios', level: 3, parent: 'EVENTOS', prefixes: ['405'] },
      { id: 'COMITE', label: 'Committees', level: 2, parent: 'INCOME', prefixes: ['493'] },
      { id: 'SERVICES', label: 'Services to Members', level: 2, parent: 'INCOME', prefixes: ['445'] },
      { id: 'GASTOS', label: 'Expense', level: 1, section: true },
      { id: 'GASTOS_MEMBERS', label: 'Membership', level: 2, parent: 'GASTOS', prefixes: ['261','8094'] },
      { id: 'GASTOS_EVENTS', label: 'Events', level: 2, parent: 'GASTOS', prefixes: ['316','436'] },
      { id: 'GASTOS_ADMIN', label: 'Gastos Administrativos', level: 2, parent: 'GASTOS', prefixes: ['847','230','331'] }
    ];

    const fmtNum = (v) => new Intl.NumberFormat('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Number(v) || 0);
    const fmtPct = (v) => `${(Number(v) * 100).toFixed(0)}%`;

    const setStatus = (text, isError = false) => {
      const el = document.getElementById('statusText');
      if (el) {
        el.textContent = `Estado: ${text}`;
        el.style.color = isError ? '#c94b43' : '#4b6a9b';
      }
    };

    const fillYears = (years) => {
      const select = document.getElementById('selReal');
      select.innerHTML = '';
      years.forEach((year) => {
        const opt = document.createElement('option');
        opt.value = year;
        opt.textContent = year;
        select.appendChild(opt);
      });
      state.realYear = years[0];
      state.prevYear = years[1] || years[0] - 1;
      state.pptoYear = years[0];
      document.getElementById('hdrRealYear').textContent = state.realYear;
      document.getElementById('hdrPptoYear').textContent = state.pptoYear;
      document.getElementById('hdrPrevYear').textContent = state.prevYear;
    };

    const headersAuth = () => {
      const h = window.Sesion?.headersAutenticacion?.() || {};
      return { ...h, 'Content-Type': 'application/json' };
    };

    const fetchYears = async () => {
      const res = await fetch(`${API_BASE}/modulos/summary-anios?empresaId=${state.empresaId}`);
      if (!res.ok) throw new Error('no fue posible listar años');
      const data = await res.json();
      const years = Array.isArray(data.anios) ? data.anios.filter(Boolean).map(Number).sort((a,b)=>b-a) : [];
      return years.length ? years : [new Date().getFullYear(), new Date().getFullYear()-1];
    };

    const fetchCodigos = async () => {
      if (!state.realYear) throw new Error('falta año real');
      const params = new URLSearchParams({ empresaId: state.empresaId, anio: state.realYear });
      const res = await fetch(`${API_BASE}/saldos/cuentas?${params.toString()}`, { headers: headersAuth() });
      if (!res.ok) throw new Error('No fue posible obtener cuentas (API no disponible)');
      const body = await res.json();
      return Array.isArray(body.cuentas) ? body.cuentas.map((c) => c.cuenta).filter(Boolean) : [];
    };

    const fetchResumen = async () => {
      const payload = {
        empresaId: state.empresaId,
        anio: state.realYear,
        periodo: 12,
        codigos: state.codigos,
        anioComparativo: state.prevYear,
        usarAjusteEnYTD: false
      };
      const res = await fetch(`${API_BASE}/modulos/summary-resumen-e`, {
        method: 'POST',
        headers: headersAuth(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('No fue posible obtener resumen-e');
      const data = await res.json();
      return Array.isArray(data.detalle) ? data.detalle : [];
    };

    const mapData = (detalle) => {
      const mapa = new Map();
      structure.forEach((item) => mapa.set(item.id, { ...item, real: 0, ppto: 0, realPrev: 0 }));
      detalle.forEach((row) => {
        const prefijo = (row.codigo || '').toString().replace(/[^0-9]/g, '').slice(0,3);
        const target = structure.find((item) => item.prefixes?.some((pref) => pref === prefijo));
        if (target) {
          const entry = mapa.get(target.id);
          entry.real += Number(row.ytdActual ?? row.acumuladoActual ?? 0);
          entry.ppto += Number(row.ytdPlan ?? row.acumuladoPlan ?? 0);
          entry.realPrev += Number(row.ytdAnterior ?? row.acumuladoAnterior ?? 0);
        }
      });
      structure.filter((item) => item.parent).forEach((child) => {
        const parent = mapa.get(child.parent);
        const current = mapa.get(child.id);
        parent.real += current.real;
        parent.ppto += current.ppto;
        parent.realPrev += current.realPrev;
      });
      const result = Array.from(mapa.values()).map((entry) => {
        const diff = entry.real - entry.ppto;
        return {
          ...entry,
          diff,
          varReal: entry.realPrev ? safeDiv(entry.real, entry.realPrev) - 1 : 0,
          varPpto: entry.ppto ? safeDiv(entry.real, entry.ppto) - 1 : 0
        };
      });
      return result;
    };

    const renderTable = () => {
      const tbody = document.getElementById('tablaResumen');
      tbody.innerHTML = '';
      if (!state.rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Sin datos disponibles</td></tr>';
        return;
      }
      state.rows.forEach((row) => {
        const tr = document.createElement('tr');
        const classes = row.section ? 'section' : row.level === 2 ? 'indent-2' : 'indent-3';
        tr.innerHTML = `
          <td class="${row.section ? 'section' : row.level === 1 ? '' : row.level === 2 ? 'indent-2' : 'indent-3'}">${row.label}</td>
          <td>${fmtNum(row.real)}</td>
          <td>${fmtNum(row.ppto)}</td>
          <td>${fmtNum(row.realPrev)}</td>
          <td class="delta ${row.varReal >= 0 ? 'text-green' : 'text-red'}">${fmtPct(row.varReal)}</td>
          <td class="delta ${row.varPpto >= 0 ? 'text-green' : 'text-red'}">${fmtPct(row.varPpto)}</td>
        `;
        tbody.appendChild(tr);
      });
    };

    const cargarResumen = async () => {
      try {
        setStatus('Cargando datos...');
        const years = await fetchYears();
        fillYears(years);
        state.codigos = await fetchCodigos();
        if (!state.codigos.length) {
          throw new Error('No se pudieron obtener cuentas (API no disponible)');
        }
        const detalle = await fetchResumen();
        state.rows = mapData(detalle);
        renderTable();
        setStatus(`Empresa ${state.empresaId}, año ${state.realYear}`);
      } catch (error) {
        console.error(error);
        setStatus(error.message, true);
        const tbody = document.getElementById('tablaResumen');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c94b43;">${error.message}</td></tr>`;
        state.rows = [];
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const selEmpresa = document.getElementById('selEmpresa');
      const selReal = document.getElementById('selReal');
      selEmpresa.addEventListener('change', (e) => {
        state.empresaId = e.target.value;
        cargarResumen();
      });
      selReal.addEventListener('change', (e) => {
        state.realYear = Number(e.target.value);
        state.prevYear = state.realYear - 1;
        document.getElementById('hdrRealYear').textContent = state.realYear;
        document.getElementById('hdrPrevYear').textContent = state.prevYear;
        cargarResumen();
      });
      cargarResumen();
    });
  </script>
</body>
</html>
