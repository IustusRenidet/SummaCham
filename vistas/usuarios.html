<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración de usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    :root {
      --bs-primary: #2f5496;
      --bs-primary-rgb: 47, 84, 150;
      --bs-success: #2f5496;
      --bs-success-rgb: 47, 84, 150;
      --bs-success-bg-subtle: rgba(47, 84, 150, 0.16);
      --bs-success-border-subtle: rgba(47, 84, 150, 0.35);
    }

    body {
      background: #f2f2f2;
      font-family: 'Manrope', system-ui, sans-serif;
      color: #2f5496;
      min-height: 100vh;
    }

    .contenedor {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(1rem, 2vw, 2rem);
    }

    .panel-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(47, 84, 150, 0.12);
      padding: clamp(1rem, 2.5vw, 2rem);
    }

    .role-badge {
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .role-admin {
      background: rgba(47, 84, 150, 0.15);
      color: #8497b0;
    }

    .role-user {
      background: rgba(47, 84, 150, 0.08);
      color: #2f5496;
    }

    .company-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border-radius: 999px;
      background: rgba(47, 84, 150, 0.12);
      color: #8497b0;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
    }

    .company-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    .alerta-global {
      border-radius: 16px;
    }

    @media (max-width: 768px) {
      .tabla-usuarios {
        font-size: 0.9rem;
      }

      .tabla-usuarios thead {
        display: none;
      }

      .tabla-usuarios tbody tr {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        padding: 1rem 0.5rem;
        border-bottom: 1px solid rgba(47, 84, 150, 0.1);
      }

      .tabla-usuarios tbody td {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .tabla-usuarios tbody td::before {
        content: attr(data-title);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: #8497b0;
      }

      .acciones {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <div id="alerta" class="alerta-global visually-hidden"></div>

    <!-- Toast flotante para avisos (éxito/error) -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
      <div id="toastUsuarios" class="toast align-items-center text-white bg-success border-0" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="toastUsuariosBody">Operación realizada correctamente.</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
      </div>
    </div>

    <section class="panel-card mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-6">
          <label for="busqueda" class="form-label fw-semibold mb-1">Buscar usuario</label>
          <input type="search" id="busqueda" class="form-control" placeholder="Buscar por usuario, nombre o correo" />
        </div>
      </div>
    </section>

    <section class="panel-card">
      <div class="table-responsive">
        <table class="table tabla-usuarios align-middle" id="tablaUsuarios">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Usuario</th>
              <th scope="col">Correo</th>
              <th scope="col">Empresas</th>
              <th scope="col">Rol</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Modal de confirmación de eliminado (estilo consistente con la UI) -->
  <div class="modal fade" id="modalConfirmarEliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:16px; overflow:hidden;">
        <div class="modal-header" style="background:#2f5496; color:#fff;">
          <h5 class="modal-title fw-bold">Confirmar eliminación</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0" id="modalEliminarMensaje">¿Deseas eliminar al usuario seleccionado? Esta acción no se puede deshacer.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-outline-danger" id="btnConfirmarEliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sesion.js"></script>
  <script>
    const API_BASE = 'http://localhost:3000/api';
    const sesion = Sesion.requerirSesion({ requireAdmin: true });
    if (!sesion) {
      throw new Error('Redireccionando al inicio de sesión.');
    }

    const alerta = document.getElementById('alerta');
    const tabla = document.getElementById('tablaUsuarios').querySelector('tbody');
    const buscador = document.getElementById('busqueda');
    const btnAgregar = document.getElementById('btnAgregarUsuario');
    const btnCerrarSesion = document.getElementById('btnCerrarSesion');

    const permisosGenerales = sesion.usuario?.permisosGenerales || {};
    const puedeAgregar = Boolean(permisosGenerales.puedeAgregar);
    const puedeModificar = Boolean(permisosGenerales.puedeModificar);
    const puedeEliminar = Boolean(permisosGenerales.puedeEliminar);

    let usuarios = [];

    const mostrarToast = (mensaje, tipo = 'success') => {
      const toastEl = document.getElementById('toastUsuarios');
      const body = document.getElementById('toastUsuariosBody');
      if (!toastEl) return;
      if (body) body.textContent = mensaje;
      toastEl.classList.remove('bg-success', 'bg-danger');
      toastEl.classList.add(tipo === 'success' ? 'bg-success' : 'bg-danger');
      const ctor = (window.bootstrap && window.bootstrap.Toast) ? window.bootstrap.Toast : null;
      if (ctor) {
        const toast = new ctor(toastEl);
        toast.show();
      } else {
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 1800);
      }
    };

    const mostrarAlerta = (mensaje, tipo = 'danger') => {
      // Mantiene compatibilidad con llamadas existentes pero usa toast para visibilidad
      mostrarToast(mensaje, tipo === 'success' ? 'success' : 'danger');
    };

    const limpiarAlerta = () => {
      alerta.className = 'alerta-global visually-hidden';
      alerta.textContent = '';
    };

    const representarEmpresas = (permisosPorEmpresa) => {
      return Object.entries(permisosPorEmpresa || {})
        .filter(([_, modulos]) => Object.values(modulos || {}).some((acciones) => acciones['Cargar y guardar'] || acciones.Revisar || acciones.Aprobar))
        .map(([empresaId]) => {
          const etiqueta = empresaId.replace('empresa', 'E');
          return `<span class="company-badge mb-1"><span class="company-dot"></span>${etiqueta}</span>`;
        }).join(' ');
    };

    const renderizarTabla = () => {
      const termino = buscador.value.trim().toLowerCase();
      tabla.innerHTML = '';

      const filtrados = usuarios.filter((usuario) => {
        if (!termino) return true;
        return [
          usuario.usuario,
          usuario.nombres,
          usuario.apellidoPrimero,
          usuario.apellidoSegundo,
          usuario.apellidos,
          usuario.correo
        ]
          .filter(Boolean)
          .some((valor) => valor.toLowerCase().includes(termino));
      });

      if (filtrados.length === 0) {
        const fila = document.createElement('tr');
        fila.innerHTML = `<td colspan="6" class="text-center text-muted py-4">No se encontraron usuarios.</td>`;
        tabla.appendChild(fila);
        return;
      }

      filtrados.forEach((usuario) => {
        const fila = document.createElement('tr');
        const puedeEditarFila = puedeModificar;
        const puedeEliminarFila = puedeEliminar && !usuario.esAdminGlobal;

        const nombreCompleto = [usuario.nombres, usuario.apellidoPrimero, usuario.apellidoSegundo]
          .filter(Boolean)
          .join(' ');

        const enlaceEditar = puedeEditarFila
          ? `<a class="btn btn-sm btn-outline-success" href="crear_usuario.html?editar=${usuario.id}">Editar</a>`
          : `<span class="btn btn-sm btn-outline-success disabled" aria-disabled="true">Editar</span>`;
        const botonEliminar = `<button class="btn btn-sm btn-outline-danger" data-accion="eliminar" data-id="${usuario.id}" ${puedeEliminarFila ? '' : 'disabled'}>Eliminar</button>`;

        fila.innerHTML = `
          <td data-title="Nombre">${nombreCompleto || '—'}</td>
          <td data-title="Usuario">${usuario.usuario}</td>
          <td data-title="Correo">${usuario.correo || '—'}</td>
          <td data-title="Empresas">${representarEmpresas(usuario.permisosPorEmpresa)}</td>
          <td data-title="Rol"><span class="role-badge ${usuario.esAdminGlobal ? 'role-admin' : 'role-user'}">${usuario.esAdminGlobal ? 'Administrador global' : 'Usuario'}</span></td>
          <td data-title="Acciones" class="text-end acciones">
            <div class="btn-group">
              ${enlaceEditar}
              ${botonEliminar}
            </div>
          </td>`;
        tabla.appendChild(fila);
      });
    };

    const cargarUsuarios = async () => {
      limpiarAlerta();
      try {
        const respuesta = await fetch(`${API_BASE}/usuarios`, {
          headers: Sesion.headersAutenticacion()
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) {
          throw new Error(datos.mensaje || 'No fue posible obtener los usuarios.');
        }
        usuarios = datos.usuarios || [];
        renderizarTabla();
      } catch (error) {
        mostrarAlerta(error.message || 'Ocurrió un error al cargar los usuarios.');
      }
    };

    const confirmarEliminacion = (mensaje) => {
      return new Promise((resolve) => {
        const modalEl = document.getElementById('modalConfirmarEliminar');
        const msgEl = document.getElementById('modalEliminarMensaje');
        const btnOk = document.getElementById('btnConfirmarEliminar');
        if (!modalEl) return resolve(confirm(mensaje || '¿Confirmar eliminación?'));

        if (msgEl && mensaje) msgEl.textContent = mensaje;
        const Modal = (window.bootstrap && window.bootstrap.Modal) ? window.bootstrap.Modal : null;
        const instancia = Modal ? new Modal(modalEl) : null;

        const cleanup = () => {
          btnOk.removeEventListener('click', onOk);
          modalEl.removeEventListener('hidden.bs.modal', onCancel);
        };
        const onOk = () => { cleanup(); instancia?.hide(); resolve(true); };
        const onCancel = () => { cleanup(); resolve(false); };
        btnOk.addEventListener('click', onOk, { once: true });
        modalEl.addEventListener('hidden.bs.modal', onCancel, { once: true });
        instancia ? instancia.show() : resolve(confirm(mensaje || '¿Confirmar eliminación?'));
      });
    };

    const eliminarUsuario = async (id) => {
      if (!puedeEliminar) {
        mostrarAlerta('No cuentas con permiso para eliminar usuarios.');
        return;
      }
      const ok = await confirmarEliminacion('¿Deseas eliminar al usuario seleccionado? Esta acción no se puede deshacer.');
      if (!ok) return;
      try {
        const respuesta = await fetch(`${API_BASE}/usuarios/${id}`, {
          method: 'DELETE',
          headers: Sesion.headersAutenticacion()
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) {
          throw new Error(datos.mensaje || 'No fue posible eliminar al usuario.');
        }
        mostrarAlerta(datos.mensaje, 'success');
        await cargarUsuarios();
      } catch (error) {
        mostrarAlerta(error.message || 'Ocurrió un problema al eliminar el usuario.');
      }
    };



    tabla.addEventListener('click', (evento) => {
      const boton = evento.target.closest('button[data-accion]');
      if (!boton || boton.disabled) return;
      const id = boton.getAttribute('data-id');
      const accion = boton.getAttribute('data-accion');
      if (accion === 'eliminar') {
        eliminarUsuario(id);
      }
    });

    buscador.addEventListener('input', renderizarTabla);

    if (!puedeAgregar && btnAgregar) {
      btnAgregar.classList.add('disabled');
      btnAgregar.setAttribute('aria-disabled', 'true');
      btnAgregar.setAttribute('tabindex', '-1');
      btnAgregar.addEventListener('click', (evento) => {
        evento.preventDefault();
        mostrarAlerta('No cuentas con permiso para agregar usuarios.');
      });
    }

    if (btnCerrarSesion) {
      btnCerrarSesion.addEventListener('click', () => {
        Sesion.limpiar();
        window.location.href = 'login.html';
      });
    }

    document.addEventListener('DOMContentLoaded', cargarUsuarios);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
