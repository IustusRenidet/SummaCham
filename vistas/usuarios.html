<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #f3f6f1;
            font-family: 'Manrope';
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(36, 50, 38, .12);
            max-width: 480px;
            width: 100%;
        }

        .form-label.required::after {
            content: " *";
            color: #c0392b;
        }

        .btn-primary {
            background: #2f6f4e;
            border-color: #2f6f4e
        }

        .btn-primary:hover {
            background: #265f43;
            border-color: #265f43
        }
    </style>
</head>
<div class="row g-4">
    <div class="col-12">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
            <h3 class="fw-bold mb-0 text-success">Administrar usuarios</h3>
            <a class="btn btn-primary" href="crear_usuario.html">Agregar usuario</a>
        </div>
    </div>


    <div class="col-12">
        <div class="card panel-card p-4">
            <input type="search" id="userSearch" class="form-control mb-3"
                placeholder="Buscar por nombre, usuario o correo...">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="usersTable">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Empresas</th>
                            <th>Rol</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>


<script>
    const EMPRESAS = [
        { key: 'empresa1', label: 'Empresa 1', dot: 'dot-1' },
        { key: 'empresa2', label: 'Empresa 2', dot: 'dot-2' },
        { key: 'empresa3', label: 'Empresa 3', dot: 'dot-3' },
        { key: 'empresa4', label: 'Empresa 4', dot: 'dot-4' },
    ];
    const users = []; // se llenará dinámicamente desde el backend o después de crear nuevos usuarios


    function renderUsersTable(filter = '') {
        const tbody = document.querySelector('#usersTable tbody');
        tbody.innerHTML = '';
        const q = filter.trim().toLowerCase();
        const list = users.filter(u => !q || [u.nombre, u.usuario, u.correo].some(v => v.toLowerCase().includes(q)));


        if (list.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="6" class="text-center text-muted py-4">Sin usuarios aún. Haz clic en <strong>Agregar usuario</strong> para crear el primero.</td>`;
            tbody.appendChild(tr);
            return;
        }


        list.forEach(u => {
            const chips = (u.empresas || []).map(k => {
                const meta = EMPRESAS.find(e => e.key === k); if (!meta) return '';
                return `<span class=\"company-badge me-1 mb-1\"><span class=\"company-dot ${meta.dot}\"></span>${meta.label.replace('Empresa ', 'E')}</span>`
            }).join('');
            const tr = document.createElement('tr');
            tr.innerHTML = `
<td>${u.nombre || ''}</td>
<td>${u.usuario || ''}</td>
<td>${u.correo || ''}</td>
<td>${chips}</td>
<td><span class=\"role-badge ${u.rol === 'admin' ? 'role-admin' : 'role-user'}\">${u.rol === 'admin' ? 'Admin' : 'Usuario'}</span></td>
<td class=\"text-end\">
<div class=\"btn-group\">
<a class=\"btn btn-sm btn-outline-primary\" href=\"crear_usuario.html?edit=${u.usuario || ''}\">Editar</a>
<button class=\"btn btn-sm btn-outline-secondary\">Reset</button>
<button class=\"btn btn-sm btn-outline-danger\" ${(u.rol === 'admin') ? 'disabled' : ''}>Eliminar</button>
</div>
</td>`;
            tbody.appendChild(tr);
        });
    }


    document.addEventListener('DOMContentLoaded', () => {
        renderUsersTable();
        document.getElementById('userSearch').addEventListener('input', (e) => renderUsersTable(e.target.value));
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
