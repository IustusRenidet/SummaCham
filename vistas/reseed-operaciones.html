<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recargar Operaciones RESUMEN 2025</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 40px; background: #f8f9fa; }
    .card { max-width: 600px; margin: 0 auto; }
    pre { background: #212529; color: #00ff00; padding: 15px; border-radius: 5px; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">🔄 Recargar Operaciones de RESUMEN</h5>
    </div>
    <div class="card-body">
      <p class="text-muted">
        Esta herramienta recarga las operaciones de consolidación (CONSOLIDATED INCOME, 
        CONSOLIDATED EXPENSES, OPERATING RESULTS, etc.) desde el archivo JSON de configuración.
      </p>
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Módulo</label>
          <select id="modulo" class="form-select">
            <option value="RESUMEN" selected>RESUMEN</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Año</label>
          <select id="anio" class="form-select">
            <option value="2025" selected>2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
          </select>
        </div>
      </div>
      
      <button id="btnReseed" class="btn btn-primary w-100">
        <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
        Recargar Operaciones
      </button>
      
      <div id="resultado" class="mt-3 d-none">
        <h6>Resultado:</h6>
        <pre id="log"></pre>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/layouts';
    
    document.getElementById('btnReseed').addEventListener('click', async () => {
      const modulo = document.getElementById('modulo').value;
      const anio = document.getElementById('anio').value;
      const btn = document.getElementById('btnReseed');
      const spinner = document.getElementById('spinner');
      const resultado = document.getElementById('resultado');
      const log = document.getElementById('log');
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      resultado.classList.add('d-none');
      
      try {
        const response = await fetch(`${API_BASE}/${modulo}/${anio}/reseed`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(window.Sesion?.headersAutenticacion?.() || {})
          },
          body: JSON.stringify({ empresaId: 'EMPRESA01' })
        });
        
        const data = await response.json();
        
        resultado.classList.remove('d-none');
        log.textContent = JSON.stringify(data, null, 2);
        
        if (data.success) {
          log.style.color = '#00ff00';
        } else {
          log.style.color = '#ff6b6b';
        }
      } catch (error) {
        resultado.classList.remove('d-none');
        log.textContent = `Error: ${error.message}`;
        log.style.color = '#ff6b6b';
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
