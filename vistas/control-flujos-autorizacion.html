<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de flujos de autorización</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <style>
    body {
      background: #f7f9fb;
      font-family: 'Manrope', system-ui, sans-serif;
      color: #1f2937;
    }
    .page-header {
      background: linear-gradient(135deg, #2f5496, #5b7dbd);
      color: #fff;
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 18px 40px rgba(47, 84, 150, 0.18);
    }
    .card-flow {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      height: 100%;
    }
    .card-flow:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .status-chip[data-estado="APROBADO"], .status-chip[data-estado="GUARDADO"] { background: #ecfdf3; color: #15803d; }
    .status-chip[data-estado="REVISADO"], .status-chip[data-estado="PENDIENTE"] { background: #eff6ff; color: #1d4ed8; }
    .status-chip[data-estado="RECHAZADO"] { background: #fef2f2; color: #b91c1c; }
    .status-chip[data-estado="EDITANDO"], .status-chip[data-estado="SIN_BORRADOR"] { background: #f8fafc; color: #475569; }
    .flow-meta { color: #475569; font-size: 0.95rem; }
    .section-pill { background: rgba(47, 84, 150, 0.08); color: #2f5496; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 700; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="page-header mb-4">
      <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
        <div>
          <p class="text-uppercase fw-bold mb-1 opacity-75" style="letter-spacing: 0.08em;">Flujos de autorización</p>
          <h1 class="h3 mb-0">Visibilidad por sección</h1>
          <p class="mb-0 opacity-75">Consulta y reabre cualquier borrador desde un panel único para todas las áreas.</p>
        </div>
        <div class="d-flex gap-2">
          <button id="btnRecargar" class="btn btn-light text-primary fw-semibold">
            <i class="bi bi-arrow-repeat me-1"></i> Actualizar estado
          </button>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-5 col-lg-4">
            <label class="form-label fw-semibold">Empresa</label>
            <input type="number" class="form-control" id="empresaId" placeholder="ID de empresa" />
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label class="form-label fw-semibold">Ejercicio</label>
            <input type="number" class="form-control" id="anio" placeholder="2024" />
          </div>
          <div class="col-6 col-md-4 col-lg-3">
            <label class="form-label fw-semibold">Filtro por sección</label>
            <select id="filtroSeccion" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-12 col-lg-3 text-lg-end">
            <button id="btnAplicar" class="btn btn-primary w-100 w-lg-auto fw-semibold">
              <i class="bi bi-funnel me-1"></i> Aplicar filtros
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="panelFlujos" data-modulos='[]'></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/panel-flujos-autorizacion.js"></script>
</body>
</html>
