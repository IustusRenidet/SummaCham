<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comités</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #2f6f4e;
      --color-secondary: #b87333;
      --color-background: #f3f6f1;
      --color-text: #243226;
    }

    body {
      background: var(--color-background);
      font-family: 'Manrope', 'Segoe UI', Tahoma, sans-serif;
      color: var(--color-text);
      min-height: 100vh;
      padding-top: 60px;
    }

    .header-card {
      background: var(--color-primary);
      color: #fff;
      border-radius: 18px;
      border: 1px solid rgba(36, 50, 38, 0.1);
      box-shadow: 0 18px 42px rgba(36, 50, 38, 0.18);
    }

    .module-card {
      border-radius: 20px;
      border: 1px solid rgba(36, 50, 38, 0.08);
      box-shadow: 0 22px 48px rgba(36, 50, 38, 0.16);
      background: #fff;
    }

    .module-card .card-body {
      padding: clamp(1.5rem, 2vw, 2.5rem);
    }

    .pill-accent {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .module-grid {
      min-height: 180px;
    }

    .module-card article {
      border: none;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffffff 0%, #f6f9f3 100%);
    }

    .module-card .card h3 {
      color: var(--color-primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container py-4 py-lg-5">
    <div class="row mb-4">
      <div class="col-12">
        <div class="card header-card">
          <div class="card-body d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
              <h1 class="h3 fw-bold mb-1">Comités</h1>
              <p class="mb-0">Seguimiento a la actividad, participantes y resultados de los comités.</p>
            </div>
            <span class="pill-accent">Datos dinámicos</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12">
        <div class="card module-card">
          <div class="card-body">
            <div id="moduleLoader" class="d-flex align-items-center gap-2 mb-3 visually-hidden">
              <div class="spinner-border text-success" role="status" aria-hidden="true"></div>
              <span class="fw-semibold text-success">Actualizando información…</span>
            </div>
            <div id="moduleStatus" class="alert alert-info">Preparando información…</div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 module-grid" id="moduleDynamicList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sesion.js"></script>
  <script src="js/modulo-generico.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initGenericModule('comites');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
