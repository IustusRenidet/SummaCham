<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel AMCHAM</title>
  <link rel="icon" type="image/x-icon" href="icono/icono.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icono/icono.png">
  <link href="vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ocultar contenido hasta verificar sesión -->
  <style>
    #app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #app-loader .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #d9d9d9;
      border-top-color: #2f5496;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    body { visibility: hidden; }
    body.session-verified { visibility: visible; }
  </style>
  
  <!-- Cargar sesion.js primero -->
  <script src="js/sesion.js"></script>
  
  <!-- Verificación de sesión INMEDIATA -->
  <script>
    (function() {
      'use strict';
      
      const start = performance.now();
      
      // Verificar que Sesion existe
      if (typeof Sesion === 'undefined') {
        console.error('❌ Sesion no está disponible');
        window.location.replace('login.html');
        return;
      }

      // Obtener sesión actual (SINCRÓNICO - solo lee localStorage)
      const sesion = Sesion.obtener();
      
      // Verificar validez de la sesión
      if (!sesion || !sesion.tokenAcceso || !sesion.usuario) {
        console.warn('⚠️ No hay sesión válida, redirigiendo...');
        window.location.replace('login.html');
        return;
      }

      // Verificar expiración del token
      if (sesion.expiracion) {
        const ahora = Date.now();
        const expira = new Date(sesion.expiracion).getTime();
        
        if (ahora >= expira) {
          console.warn('⚠️ Token expirado');
          Sesion.cerrar();
          window.location.replace('login.html');
          return;
        }
      }

      const elapsed = performance.now() - start;
      console.log(`✅ Sesión válida: ${sesion.usuario.usuario} (${elapsed.toFixed(2)}ms)`);
      
      // Mostrar contenido
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('session-verified');
        const loader = document.getElementById('app-loader');
        if (loader) loader.remove();
      });
    })();
  </script>
  
  <style>
    :root {
       --color-primario: #2f5496;
      --color-primario-claro: #8497b0;
      --color-fondo: #f2f2f2;
      --color-texto: #2f5496;
      --color-neutro: #d9d9d9;
      --bs-primary: #2f5496;
      --bs-primary-rgb: 47, 84, 150;
      --bs-success: #2f5496;
      --bs-success-rgb: 47, 84, 150;
      --bs-success-bg-subtle: rgba(47, 84, 150, 0.16);
      --bs-success-border-subtle: rgba(47, 84, 150, 0.35);
      --sidebar-width: clamp(252px, 22vw, 340px);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--color-fondo);
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--color-texto);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    body.sidebar-locked {
      overflow: hidden;
    }

    .app-layout {
      flex: 1;
      display: flex;
      /* Asegura que sidebar y contenido ocupen el alto de la ventana */
      min-height: 100vh;
      position: relative;
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      border: none;
      padding: 0;
      margin: 0;
      z-index: 1100;
      cursor: pointer;
      backdrop-filter: blur(1px);
    }

    .app-sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid rgba(132, 151, 176, 0.35);
      box-shadow: 0 20px 40px rgba(47, 84, 150, 0.12);
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      max-height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.75rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(132, 151, 176, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

      .sidebar-logo {
      max-width: min(180px, 80%);
      height: auto;
    }

    .sidebar-menu {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    .sidebar-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid rgba(132, 151, 176, 0.35);
      background: rgba(132, 151, 176, 0.15);
    }

    .sidebar-group {
      margin-bottom: 1.5rem;
    }

    .sidebar-group:last-child {
      margin-bottom: 0;
    }

    .sidebar-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: rgba(47, 84, 150, 0.7);
      margin-bottom: 0.75rem;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      color: inherit;
      text-align: left;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .sidebar-link:hover,
    .sidebar-link:focus {
      background: rgba(47, 84, 150, 0.12);
      color: var(--color-primario);
      outline: none;
      transform: translateX(4px);
    }

    .sidebar-link.active {
      background: var(--color-primario);
      color: #ffffff;
      box-shadow: 0 18px 40px rgba(47, 84, 150, 0.2);
    }

    .sidebar-link .badge {
      background: rgba(255, 255, 255, 0.18);
      color: inherit;
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--color-fondo);
    }

    .app-layout.sidebar-hidden .app-sidebar {
      width: 0;
      transform: translateX(calc(-1 * var(--sidebar-width)));
      box-shadow: none;
    }

    .app-layout.sidebar-hidden .app-content {
      box-shadow: none;
    }

    .top-bar {
      padding: 1.5rem 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      font-weight: 800;
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      color: var(--color-primario);
      margin: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .sidebar-toggle-btn {
      border: none;
      background: rgba(47, 84, 150, 0.15);
      color: var(--color-primario);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .sidebar-toggle-btn:hover,
    .sidebar-toggle-btn:focus {
      background: rgba(47, 84, 150, 0.2);
      color: #ffffff;
      outline: none;
      transform: translateY(-1px);
    }

    .sidebar-toggle-btn.collapsed {
      background: rgba(132, 151, 176, 0.25);
      color: rgba(47, 84, 150, 0.8);
    }

    .company-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(132, 151, 176, 0.2);
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
    }

    .company-selector label {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(47, 84, 150, 0.75);
    }

    .company-selector select {
      min-width: 200px;
    }

    .notification-bell {
      position: relative;
    }

    .notification-bell__button {
      border: none;
      background: rgba(47, 84, 150, 0.1);
      color: var(--color-primario);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .notification-bell__button:hover,
    .notification-bell__button:focus {
      background: rgba(47, 84, 150, 0.2);
      color: #fff;
    }

    .notification-bell__badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #dc3545;
      color: #fff;
      border-radius: 999px;
      font-size: 0.7rem;
      padding: 0 0.35rem;
      font-weight: 700;
    }

    .notification-panel {
      position: absolute;
      top: calc(100% + 0.75rem);
      right: 0;
      width: min(320px, 80vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(47, 84, 150, 0.15);
      padding: 1rem;
      z-index: 1200;
    }

    .notification-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .notification-panel__list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 360px;
      overflow-y: auto;
    }

    .notification-panel__item {
      border: 1px solid rgba(47, 84, 150, 0.15);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .notification-panel__item--new {
      border-color: var(--color-primario);
      box-shadow: 0 12px 30px rgba(47, 84, 150, 0.15);
    }

    .notification-panel__title {
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--color-primario);
    }

    .notification-panel__message {
      font-size: 0.9rem;
      color: rgba(47, 84, 150, 0.8);
    }

    @media (max-width: 640px) {
      .notification-panel {
        position: fixed;
        top: 96px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 92vw;
        max-width: 420px;
        max-height: 70vh;
        overflow-y: auto;
      }

      .notification-panel__list {
        max-height: none;
      }
    }

    .top-bar .badge {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(132, 151, 176, 0.2);
      color: var(--color-primario);
    }

    .content-wrapper {
      flex: 1;
      padding: 0 1.5rem 1.5rem;
      margin: 0 auto;
      width: 100%;
      max-width: 1480px;
      overflow-y: auto; /* Scroll independiente del sidebar */
      overflow-x: hidden;
    }

    .content-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(47, 84, 150, 0.12);
      border: 1px solid rgba(132, 151, 176, 0.25);
      height: 100%;
      min-height: calc(100vh - 190px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .content-iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: var(--color-fondo);
      min-height: calc(100vh - 230px);
      display: block;
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
    }

    .empty-state h3 {
      font-weight: 700;
      color: var(--color-primario);
    }

    .empty-state p {
      color: rgba(47, 84, 150, 0.75);
      max-width: 420px;
      margin: 0 auto;
    }

    .login-card {
      max-width: 480px;
      margin: auto;
      padding: clamp(1.75rem, 4vw, 3rem);
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(47, 84, 150, 0.12);
    }

    .login-card h1 {
      font-weight: 800;
      color: var(--color-primario);
    }

    .btn-verde {
      background: var(--color-primario);
      border-color: var(--color-primario);
      font-weight: 700;
      padding-block: 0.75rem;
    }

    .btn-verde:hover,
    .btn-verde:focus {
      background: var(--color-primario-claro);
      border-color: var(--color-primario-claro);
    }

    .submodule-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .module-count {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(47, 84, 150, 0.65);
      text-transform: uppercase;
    }

    /* Badges shown for module groups or nested groups */
    .module-badge {
      font-size: 0.65rem;
      background: rgba(47, 84, 150, 0.08);
      color: rgba(47, 84, 150, 1);
      padding: 0.18rem 0.45rem;
      border-radius: 999px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .user-info strong {
      font-size: 1rem;
    }

    .sidebar-session-label {
      letter-spacing: 0.08em;
      font-size: 0.7rem;
    }

    .sidebar-user-name {
      font-size: 0.98rem;
    }

    .sidebar-user-handle {
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .sidebar-footer .btn-logout {
      font-weight: 600;
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.95rem;
    }

    .submenu-toggle {
      border: none;
      background: rgba(132, 151, 176, 0.2);
      width: 100%;
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: inherit;
    }

    .submenu-toggle:hover,
    .submenu-toggle:focus {
      background: rgba(47, 84, 150, 0.2);
      color: var(--color-primario);
      outline: none;
    }

    .submenu-content {
      padding: 0.75rem;
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    @media (min-width: 1200px) {
      .sidebar-header {
        padding: 1.25rem 1.2rem 0.85rem;
      }

      .sidebar-logo {
        max-width: 150px;
      }

      .sidebar-menu {
        padding: 1.25rem;
      }

      .sidebar-group {
        margin-bottom: 1.25rem;
      }

      .sidebar-footer {
        padding: 0.8rem 1.2rem;
      }

      .sidebar-footer .user-info {
        gap: 0.15rem;
      }

      .sidebar-session-label {
        font-size: 0.62rem;
      }

      .sidebar-user-name {
        font-size: 0.92rem;
      }

      .sidebar-user-handle {
        font-size: 0.78rem;
      }

      .sidebar-footer .btn-logout {
        padding: 0.35rem 0.75rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 992px) {
      .app-layout {
        flex-direction: column;
        position: relative;
      }

      .app-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: min(92vw, 360px);
        max-width: 360px;
        transform: translateX(-105%);
        border-right: 1px solid rgba(132, 151, 176, 0.35);
        border-bottom: none;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
        z-index: 1200;
        background: #ffffff;
        overflow-y: auto;
        padding-bottom: 1rem;
      }

      .app-layout:not(.sidebar-hidden) .app-sidebar {
        transform: translateX(0);
      }

      .app-layout.sidebar-hidden .app-sidebar {
        transform: translateX(-105%);
      }

      .sidebar-menu {
        max-height: calc(100vh - 220px);
      }

      .sidebar-footer {
        position: sticky;
        bottom: 0;
        background: #fff;
        box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.06);
      }

      .content-wrapper {
        padding: 0 1rem 1.25rem;
      }

      .top-bar {
        padding: 1rem 1rem 0.75rem;
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }

      .top-bar-left {
        justify-content: space-between;
        width: 100%;
      }

      .top-bar-right {
        width: 100%;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .top-bar h2 {
        font-size: 1.2rem;
      }

      .company-selector {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .company-selector select {
        flex: 1 1 100%;
        min-width: 0;
        width: 100%;
      }

      .content-card {
        border-radius: 16px;
        min-height: calc(100vh - 180px);
      }

      .content-iframe {
        min-height: calc(100vh - 220px);
      }
    }

    @media (max-width: 640px) {
      .top-bar {
        padding-top: 0.85rem;
        padding-bottom: 0.35rem;
        gap: 0.65rem;
      }

      .top-bar-left {
        gap: 0.75rem;
      }

      .sidebar-toggle-btn {
        width: 42px;
        height: 42px;
      }

      .company-selector {
        padding: 0.55rem 0.65rem;
      }

      .company-selector label {
        width: 100%;
        font-size: 0.72rem;
      }

      .notification-bell__button {
        width: 40px;
        height: 40px;
      }

      .content-wrapper {
        padding: 0 0.85rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Loader mientras se verifica la sesión -->
  <div id="app-loader">
    <div class="spinner"></div>
  </div>
  
  <div id="root" class="h-100"></div>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  
  <!-- Verificación de sesión final antes de React -->
  <script>
    (function() {
      'use strict';
      
      const sesion = Sesion.obtener();
      
      if (!sesion || !sesion.usuario || !sesion.tokenAcceso) {
        console.error('❌ Sesión inválida al cargar React');
        window.location.replace('login.html');
        throw new Error('Sesión no válida');
      }

      // Exponer sesión globalmente para React
      window.__APP_SESSION__ = sesion;
      console.log('✅ Sesión confirmada para React:', sesion.usuario.usuario);
    })();
  </script>
  
  <script src="js/capitulos-modulos.js"></script>
  <script src="js/react-app.js"></script>
</body>
</html>
