<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel AMCHAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-verde: #2f6f4e;
      --color-verde-oscuro: #1f4b35;
      --color-fondo: #f3f6f1;
      --color-texto: #243226;
      --color-cobre: #b87333;
      --sidebar-width: clamp(260px, 22vw, 320px);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--color-fondo);
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--color-texto);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .app-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .app-sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid rgba(36, 50, 38, 0.08);
      box-shadow: 0 20px 40px rgba(36, 50, 38, 0.12);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .sidebar-header {
      padding: 1.75rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(36, 50, 38, 0.08);
    }

    .sidebar-header h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 800;
      color: var(--color-verde);
    }

    .sidebar-menu {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }

    .sidebar-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid rgba(36, 50, 38, 0.08);
      background: rgba(47, 111, 78, 0.05);
    }

    .sidebar-group {
      margin-bottom: 1.5rem;
    }

    .sidebar-group:last-child {
      margin-bottom: 0;
    }

    .sidebar-group-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: rgba(36, 50, 38, 0.55);
      margin-bottom: 0.75rem;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      color: inherit;
      text-align: left;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .sidebar-link:hover,
    .sidebar-link:focus {
      background: rgba(47, 111, 78, 0.08);
      color: var(--color-verde);
      outline: none;
      transform: translateX(4px);
    }

    .sidebar-link.active {
      background: var(--color-verde);
      color: #ffffff;
      box-shadow: 0 18px 40px rgba(47, 111, 78, 0.18);
    }

    .sidebar-link .badge {
      background: rgba(255, 255, 255, 0.18);
      color: inherit;
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .app-layout.sidebar-hidden .app-sidebar {
      transform: translateX(calc(-1 * var(--sidebar-width)));
      box-shadow: none;
    }

    .app-layout.sidebar-hidden .app-content {
      box-shadow: none;
    }

    .top-bar {
      padding: 1.5rem 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      font-weight: 800;
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      color: var(--color-verde);
      margin: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .sidebar-toggle-btn {
      border: none;
      background: rgba(47, 111, 78, 0.12);
      color: var(--color-verde);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .sidebar-toggle-btn:hover,
    .sidebar-toggle-btn:focus {
      background: rgba(47, 111, 78, 0.18);
      color: var(--color-verde-oscuro);
      outline: none;
      transform: translateY(-1px);
    }

    .sidebar-toggle-btn.collapsed {
      background: rgba(36, 50, 38, 0.08);
      color: rgba(36, 50, 38, 0.7);
    }

    .company-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(47, 111, 78, 0.08);
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
    }

    .company-selector label {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(36, 50, 38, 0.7);
    }

    .company-selector select {
      min-width: 200px;
    }

    .top-bar .badge {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(47, 111, 78, 0.12);
      color: var(--color-verde-oscuro);
    }

    .content-wrapper {
      flex: 1;
      padding: 0 2rem 2rem;
      overflow: hidden;
    }

    .content-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(36, 50, 38, 0.12);
      border: 1px solid rgba(36, 50, 38, 0.08);
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .content-iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: var(--color-fondo);
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
    }

    .empty-state h3 {
      font-weight: 700;
      color: var(--color-verde);
    }

    .empty-state p {
      color: rgba(36, 50, 38, 0.7);
      max-width: 420px;
      margin: 0 auto;
    }

    .login-card {
      max-width: 480px;
      margin: auto;
      padding: clamp(1.75rem, 4vw, 3rem);
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(36, 50, 38, 0.12);
    }

    .login-card h1 {
      font-weight: 800;
      color: var(--color-verde);
    }

    .btn-verde {
      background: var(--color-verde);
      border-color: var(--color-verde);
      font-weight: 700;
      padding-block: 0.75rem;
    }

    .btn-verde:hover,
    .btn-verde:focus {
      background: var(--color-verde-oscuro);
      border-color: var(--color-verde-oscuro);
    }

    .submodule-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .module-count {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(36, 50, 38, 0.6);
      text-transform: uppercase;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .user-info strong {
      font-size: 1rem;
    }

    .submenu-toggle {
      border: none;
      background: rgba(47, 111, 78, 0.08);
      width: 100%;
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: inherit;
    }

    .submenu-toggle:hover,
    .submenu-toggle:focus {
      background: rgba(47, 111, 78, 0.14);
      color: var(--color-verde-oscuro);
      outline: none;
    }

    .submenu-content {
      padding: 0.75rem;
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    @media (max-width: 992px) {
      .app-layout {
        flex-direction: column;
      }

      .app-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(36, 50, 38, 0.08);
        transform: translateY(0);
      }

      .app-layout.sidebar-hidden .app-sidebar {
        transform: translateY(0);
      }

      .sidebar-menu {
        max-height: 240px;
      }

      .content-wrapper {
        padding: 0 1.25rem 1.25rem;
      }

      .top-bar {
        padding: 1.25rem 1.25rem 0.75rem;
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }

      .top-bar-left {
        justify-content: space-between;
        width: 100%;
      }

      .company-selector {
        width: 100%;
        justify-content: space-between;
      }

      .company-selector select {
        flex: 1;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div id="root" class="h-100"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="js/sesion.js"></script>
  <script type="text/babel" src="js/react-app.jsx"></script>
</body>
</html>
