<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primario: #2f5496;
      --color-primario-claro: #8497b0;
      --color-fondo: #f2f2f2;
      --color-texto: #2f5496;
      --bs-primary: #2f5496;
      --bs-primary-rgb: 47, 84, 150;
      --bs-success: #2f5496;
      --bs-success-rgb: 47, 84, 150;
      --bs-success-bg-subtle: rgba(47, 84, 150, 0.16);
      --bs-success-border-subtle: rgba(47, 84, 150, 0.35);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--color-fondo);
      font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--color-texto);
      overflow: hidden;
    }

    .tarjeta-acceso {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(47, 84, 150, 0.12);
      padding: 2.5rem 2rem;
      width: 420px;
      max-width: 100%;
      margin: auto;
    }

    .tarjeta-acceso h1 {
      font-weight: 800;
      color: var(--color-primario);
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-verde {
      background: var(--color-primario);
      border-color: var(--color-primario);
      font-weight: 700;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-verde:hover,
    .btn-verde:focus {
      background: var(--color-primario-claro);
      border-color: var(--color-primario-claro);
      transform: translateY(-1px);
    }

    .mensaje-estado {
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    label span {
      color: #2f5496;
    }

    .form-control-lg {
      padding: 0.75rem 1rem;
      font-size: 1rem;
    }

    .input-group .btn {
      padding: 0.75rem 1rem;
    }

    .mb-3 {
      margin-bottom: 1.25rem !important;
    }

    header.mb-4 {
      margin-bottom: 1.75rem !important;
    }
  </style>
</head>

<body>
  <main class="tarjeta-acceso" aria-labelledby="titulo-login">
    <header class="mb-4 text-center text-md-start">
      <h1 id="titulo-login" class="h3 mb-1">AmCham</h1>
    </header>

    <div id="alerta" class="mensaje-estado visually-hidden" role="alert"></div>

    <form id="formularioLogin" novalidate class="needs-validation" autocomplete="off">
      <div class="mb-3">
        <label for="usuario" class="form-label fw-semibold">Usuario <span aria-hidden="true">*</span></label>
        <input type="text" id="usuario" name="usuario" class="form-control form-control-lg" required autocomplete="username" placeholder="" />
        <div class="invalid-feedback">Ingresa tu usuario.</div>
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label fw-semibold">Contraseña <span aria-hidden="true">*</span></label>
        <div class="input-group">
          <input type="password" id="contrasena" name="contrasena" class="form-control form-control-lg" required autocomplete="current-password" />
          <button type="button" class="btn btn-outline-secondary" id="toggleContrasena" aria-pressed="false" aria-label="Mostrar contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12 8 12s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/>
            </svg>
          </button>
        </div>
        <div class="invalid-feedback">Ingresa tu contraseña.</div>
      </div>

      <button type="submit" class="btn btn-verde w-100" id="botonIngresar">
        <span class="spinner-border spinner-border-sm me-2 visually-hidden" role="status" aria-hidden="true"></span>
        Ingresar
      </button>
    </form>
  </main>

  <script src="js/sesion.js"></script>
  <script>
    // Detectar API_BASE dinámicamente según el entorno
    const API_BASE = (() => {
      if (window.location.protocol === 'file:') {
        const origin = window.location.protocol === 'file:' ? 'http://localhost:3005' : window.location.origin;
        return `${origin}/api`;
      }
      return `${window.location.origin.replace(/\/$/, '')}/api`;
    })();
    
    const formulario = document.getElementById('formularioLogin');
    const alerta = document.getElementById('alerta');
    const boton = document.getElementById('botonIngresar');
    const spinner = boton.querySelector('.spinner-border');

    const mostrarAlerta = (mensaje, tipo = 'danger') => {
      alerta.textContent = mensaje;
      alerta.className = `mensaje-estado alert alert-${tipo}`;
      alerta.classList.remove('visually-hidden');
    };

    const limpiarAlerta = () => {
      alerta.className = 'mensaje-estado visually-hidden';
      alerta.textContent = '';
    };

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      evento.stopPropagation();

      limpiarAlerta();
      boton.disabled = true;
      spinner.classList.remove('visually-hidden');

      const cuerpo = {
        usuario: formulario.usuario.value,
        contrasena: formulario.contrasena.value
      };

      try {
        const respuesta = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cuerpo)
        });

        const datos = await respuesta.json();
        if (!respuesta.ok) {
          throw new Error(datos.mensaje || 'No fue posible iniciar sesión.');
        }

        Sesion.guardar(datos);

        window.location.href = 'app.html';
      } catch (error) {
        mostrarAlerta(error.message || 'Ocurrió un problema durante el inicio de sesión.');
      } finally {
        boton.disabled = false;
        spinner.classList.add('visually-hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      Sesion.limpiar();
      
      // Eventos Enter para navegación fluida
      const usuarioInput = document.getElementById('usuario');
      const contrasenaInput = document.getElementById('contrasena');
      
      if (usuarioInput && contrasenaInput) {
        // Enter en usuario → enfocar contraseña
        usuarioInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            contrasenaInput.focus();
          }
        });
        
        // Enter en contraseña → enviar formulario
        contrasenaInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            formulario.requestSubmit();
          }
        });
      }
      
      const toggle = document.getElementById('toggleContrasena');
      const input = document.getElementById('contrasena');
      if (toggle && input) {
        toggle.addEventListener('click', () => {
          const visible = input.getAttribute('type') === 'text';
          input.setAttribute('type', visible ? 'password' : 'text');
          toggle.setAttribute('aria-pressed', visible ? 'false' : 'true');
          toggle.innerHTML = visible
            ? `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" fill=\"currentColor\" class=\"bi bi-eye\" viewBox=\"0 0 16 16\"><path d=\"M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12 8 12s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z\"/><path d=\"M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5\"/></svg>`
            : `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" fill=\"currentColor\" class=\"bi bi-eye-slash\" viewBox=\"0 0 16 16\"><path d=\"M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5c-1.304 0-2.55.29-3.676.8l.823.823A6.7 6.7 0 0 1 8 3.5C12.28 3.5 15 8 15 8s-.51.88-1.641 2.012l-.001.001-.707-.707c.58-.58 1.04-1.17 1.348-1.667a13 13 0 0 0-2.19-2.572c-.456-.4-.936-.746-1.43-1.03l-.708.708c.45.244.885.54 1.297.884.405.338.79.707 1.154 1.105-.278.39-.648.86-1.11 1.322l-.703-.703z\"/><path d=\"M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.62 2.62.707-.707a6.7 6.7 0 0 1-1.384.161C4.72 11.25 2 6.75 2 6.75s.879-1.52 2.641-2.762l-.707-.707C2.94 4.28 2 6 2 6s3 5.5 8 5.5c.48 0 .95-.05 1.398-.145l-.721-.721z\"/></svg>`;
        });
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
