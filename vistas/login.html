<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-verde: #2f6f4e;
      --color-verde-oscuro: #1f4b35;
      --color-fondo: #f3f6f1;
      --color-texto: #243226;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--color-fondo);
      font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--color-texto);
    }

    .tarjeta-acceso {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(36, 50, 38, 0.12);
      padding: clamp(1.5rem, 4vw, 3rem);
      width: min(480px, 100%);
    }

    .tarjeta-acceso h1 {
      font-weight: 800;
      color: var(--color-verde);
    }

    .btn-verde {
      background: var(--color-verde);
      border-color: var(--color-verde);
      font-weight: 700;
      padding-block: 0.75rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-verde:hover,
    .btn-verde:focus {
      background: var(--color-verde-oscuro);
      border-color: var(--color-verde-oscuro);
      transform: translateY(-1px);
    }

    .mensaje-estado {
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    label span {
      color: #b02a37;
    }
  </style>
</head>

<body>
  <main class="tarjeta-acceso" aria-labelledby="titulo-login">
    <header class="mb-4 text-center text-md-start">
      <h1 id="titulo-login" class="h3 mb-1">Panel financiero AmCham</h1>
      <p class="text-muted mb-0">Selecciona tu empresa y autentícate para continuar.</p>
    </header>

    <div id="alerta" class="mensaje-estado visually-hidden" role="alert"></div>

    <form id="formularioLogin" novalidate class="needs-validation" autocomplete="off">
      <div class="mb-3">
        <label for="usuario" class="form-label fw-semibold">Usuario <span aria-hidden="true">*</span></label>
        <input type="text" id="usuario" name="usuario" class="form-control form-control-lg" required autocomplete="username" placeholder="ICONET" />
        <div class="invalid-feedback">Ingresa tu usuario.</div>
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label fw-semibold">Contraseña <span aria-hidden="true">*</span></label>
        <input type="password" id="contrasena" name="contrasena" class="form-control form-control-lg" required autocomplete="current-password" />
        <div class="invalid-feedback">Ingresa tu contraseña.</div>
      </div>

      <div class="mb-4">
        <label for="empresa" class="form-label fw-semibold">Empresa <span aria-hidden="true">*</span></label>
        <select id="empresa" name="empresa" class="form-select form-select-lg" required aria-describedby="ayuda-empresa">
        </select>
        <div id="ayuda-empresa" class="form-text">Las empresas están vinculadas a bases de datos Firebird independientes.</div>
        <div class="invalid-feedback">Selecciona la empresa con la que deseas trabajar.</div>
      </div>

      <button type="submit" class="btn btn-verde w-100" id="botonIngresar">
        <span class="spinner-border spinner-border-sm me-2 visually-hidden" role="status" aria-hidden="true"></span>
        Ingresar
      </button>
    </form>
  </main>

  <script src="js/sesion.js"></script>
  <script>
    const API_BASE = 'http://localhost:3000/api';
    const selectEmpresa = document.getElementById('empresa');
    const formulario = document.getElementById('formularioLogin');
    const alerta = document.getElementById('alerta');
    const boton = document.getElementById('botonIngresar');
    const spinner = boton.querySelector('.spinner-border');

    const mostrarAlerta = (mensaje, tipo = 'danger') => {
      alerta.textContent = mensaje;
      alerta.className = `mensaje-estado alert alert-${tipo}`;
      alerta.classList.remove('visually-hidden');
    };

    const limpiarAlerta = () => {
      alerta.className = 'mensaje-estado visually-hidden';
      alerta.textContent = '';
    };

    const cargarEmpresas = async () => {
      try {
        const respuesta = await fetch(`${API_BASE}/empresas`);
        const datos = await respuesta.json();
        selectEmpresa.innerHTML = '<option value="" disabled selected>Selecciona una empresa</option>';
        (datos.empresas || []).forEach((empresa) => {
          const opcion = document.createElement('option');
          opcion.value = empresa.id;
          opcion.textContent = `${empresa.etiqueta} — ${empresa.nombre}`;
          selectEmpresa.appendChild(opcion);
        });
      } catch (error) {
        mostrarAlerta('No fue posible obtener la lista de empresas. Verifica el servicio local.');
      }
    };

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      evento.stopPropagation();

      if (!formulario.checkValidity()) {
        formulario.classList.add('was-validated');
        return;
      }

      limpiarAlerta();
      boton.disabled = true;
      spinner.classList.remove('visually-hidden');

      const cuerpo = {
        usuario: formulario.usuario.value,
        contrasena: formulario.contrasena.value,
        empresaId: formulario.empresa.value
      };

      try {
        const respuesta = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cuerpo)
        });

        const datos = await respuesta.json();
        if (!respuesta.ok) {
          throw new Error(datos.mensaje || 'No fue posible iniciar sesión.');
        }

        Sesion.guardar(datos);

        const permisosGenerales = datos.usuario?.permisosGenerales || {};
        const esAdmin = Sesion.esAdmin(datos);
        const tienePermisoUsuarios = Boolean(permisosGenerales.puedeAgregar || permisosGenerales.puedeModificar || permisosGenerales.puedeEliminar);

        if (esAdmin || tienePermisoUsuarios) {
          window.location.href = 'usuarios.html';
        } else {
          window.location.href = 'Vista1.html';
        }
      } catch (error) {
        mostrarAlerta(error.message || 'Ocurrió un problema durante el inicio de sesión.');
      } finally {
        boton.disabled = false;
        spinner.classList.add('visually-hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      Sesion.limpiar();
      cargarEmpresas();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
