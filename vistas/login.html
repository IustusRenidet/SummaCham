<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #f3f6f1;
            font-family: 'Manrope';
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(36, 50, 38, .12);
            max-width: 480px;
            width: 100%;
        }

        .form-label.required::after {
            content: " *";
            color: #c0392b;
        }

        .btn-primary {
            background: #2f6f4e;
            border-color: #2f6f4e
        }

        .btn-primary:hover {
            background: #265f43;
            border-color: #265f43
        }
    </style>
</head>

<body>
    <div class="card login-card p-4 p-lg-5">
        <h2 class="fw-bold mb-1 text-success">Iniciar sesión</h2>
        <form id="loginForm" class="row g-3">
            <div class="col-12">
                <label class="form-label required">Usuario</label>
                <input type="text" class="form-control" id="loginUser" placeholder="siglas" required>
            </div>
            <div class="col-12">
                <label class="form-label required">Contraseña</label>
                <input type="password" class="form-control" id="loginPass" required>
            </div>
            <div class="col-12">
                <select name="loginSelect" id="loginSelect" required class="form-select">
                    <option value="empresa1">CDMX</option>
                    <option value="empresa2">GDL</option>
                    <option value="empresa3">MTY</option>
                    <option value="empresa4">Noroeste</option>
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>
            </div>
        </form>
    </div>


    <script>
        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value.trim();
            if (!u || !p) { alert('Ingresa usuario y contraseña'); return; }
            if (u === 'admin') window.location.href = 'usuarios.html';
            else alert('Solo el usuario administrador global puede ingresar al panel de usuarios.');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
